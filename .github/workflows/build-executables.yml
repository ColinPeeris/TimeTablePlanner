name: Build Executables (Windows & macOS)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: TimeTablePlanner-windows.exe
            dist_path: dist/main.exe
          - os: macos-latest
            artifact_name: TimeTablePlanner-macos
            dist_path: dist/main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --name main main.py

      - name: Rename executable
        shell: bash
        run: |
          mv ${{ matrix.dist_path }} ${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TimeTablePlanner-windows.exe/TimeTablePlanner-windows.exe
            TimeTablePlanner-macos/TimeTablePlanner-macos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
