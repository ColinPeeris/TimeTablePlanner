[schedule]
# Daily schedule grid in HHMM
start = 0700
end = 1900
# Length of each availability slot in minutes
slot_minutes = 30

[fairness]
# Options: week, day_sum, day_max
mode = week

[lunch]
# Lunch window start/end in HHMM
start = 1100
end = 1430
# Minimum number of half-hour rest slots required during the lunch window
min_rest_slots = 1
